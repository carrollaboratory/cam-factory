  description: The purpose of the OMIT ontology is to establish data exchange 
    standards and common data elements in the microRNA (miR) domain. Biologists 
    (cell biologists in particular) and bioinformaticians can make use of OMIT 
    to leverage emerging semantic technologies in knowledge acquisition and 
    discovery for more effective identification of important roles performed by 
    miRs in humans' various diseases and biological processes (usually through 
    miRs' respective target genes).
