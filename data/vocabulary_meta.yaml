http://unitsofmeasure.org:
  name: Unified Code for Units of Measure
  vocabulary_prefix: ucum
  vocabulary_uri: https://units-of-measurement.org/
  fhir_system: http://unitsofmeasure.org
  description: Unified Code for Units of Measure (UCUM) is a code system intended to include all units of measures being contemporarily used in international science, engineering, and business.
https://loinc.org/:
  name: Logical Observation Identifiers Names and Codes
  vocabulary_prefix: loinc
  vocabulary_uri: https://loinc.org/rdf/
  fhir_system: http://loinc.org
  description: The international standard for identifying health measurements, observations, and documents.
http://purl.obolibrary.org/obo/hp.owl:
  name: Human Phenotype Ontology
  vocabulary_prefix: HP
  vocabulary_uri: http://purl.obolibrary.org/obo/HP_
  fhir_system: http://purl.obolibrary.org/obo/hp.owl
  description: The Human Phenotype Ontology (HPO) aims to provide a standardized vocabulary of phenotypic abnormalities encountered in human disease. Each term in the HPO describes a phenotypic abnormality, such as atrial septal defect. The HPO is currently being developed using the medical literature, Orphanet, DECIPHER, and OMIM.
http://purl.obolibrary.org/obo/mondo.owl:
  name: Mondo Disease Ontology
  vocabulary_prefix: MONDO
  vocabulary_uri: http://purl.obolibrary.org/obo/MONDO_
  fhir_system: http://purl.obolibrary.org/obo/mondo.owl
  description: The Mondo Disease Ontology (Mondo) aims to harmonize disease definitions across the world.
http://snomed.info/sct:
  name: Systematized Nomenclature of Medicine - Clinical Terms
  vocabulary_prefix: snomedct
  vocabulary_uri: http://snomed.info/id/
  fhir_system: http://snomed.info/sct
  description: SNOMED CT (Systematized Nomenclature of Medicine -- Clinical Terms), is a systematically organized computer processable collection of medical terminology covering most areas of clinical information such as diseases, findings, procedures, microorganisms, pharmaceuticals, etc.
http://purl.obolibrary.org/obo/maxo.owl:
  name: Medical Action Ontology
  vocabulary_prefix: MAXO
  vocabulary_uri: http://purl.obolibrary.org/obo/MAXO_
  fhir_system: http://purl.obolibrary.org/obo/maxo.owl
  description: An ontology to represent medically relevant actions, procedures, therapies, interventions, and recommendations.
http://purl.obolibrary.org/obo/omit.owl:
  name: Ontology for MicroRNA Target
  vocabulary_prefix: OMIT
  vocabulary_uri: http://purl.obolibrary.org/obo/OMIT_
  fhir_system: http://purl.obolibrary.org/obo/omit.owl
  description: The purpose of the OMIT ontology is to establish data exchange standards and common data elements in the microRNA (miR) domain. Biologists (cell biologists in particular) and bioinformaticians can make use of OMIT to leverage emerging semantic technologies in knowledge acquisition and discovery for more effective identification of important roles performed by miRs in humans' various diseases and biological processes (usually through miRs' respective target genes).
http://purl.obolibrary.org/obo/ncit.owl:
  name: National Cancer Institute Thesaurus
  vocabulary_prefix: NCIT
  vocabulary_uri: http://purl.obolibrary.org/obo/NCIT_
  fhir_system: http://purl.obolibrary.org/obo/ncit.owl
  description: NCI Thesaurus (NCIt) provides reference terminology covering vocabulary for clinical care, translational and basic research, and public information and administrative activities, providing a stable and unique identification code.
https://www.meddra.org:
  name: Medical Dictionary for Regulatory Activities Terminology
  vocabulary_prefix: meddra
  vocabulary_uri: http://purl.bioontology.org/ontology/MDRFRE/
  fhir_system: https://www.meddra.org
  description: The Medical Dictionary for Regulatory Activities (MedDRA) was developed by the International Council for Harmonisation of Technical Requirements for Registration of Pharmaceuticals for Human Use (ICH)to provide a standardised medical terminology to facilitate sharing of regulatory information internationally for medical products used by humans. It is used within regulatory processes, safety monitoring, as well as for marketing activities. Products covered by the scope of MedDRA include pharmaceuticals, biologics, vaccines and drug-device combination products. The MedDRA dictionary is organized by System Organ Class (SOC), divided into High-Level Group Terms (HLGT), High-Level Terms (HLT), Preferred Terms (PT) and finally into Lowest Level Terms (LLT).
urn:oid:2.16.840.1.113883.6.177:
  name: Medical Subject Headings
  vocabulary_prefix: mesh
  vocabulary_uri: http://id.nlm.nih.gov/mesh/
  fhir_system: http://terminology.hl7.org/CodeSystem/MSH
  description: MeSH (Medical Subject Headings) is the National Library of Medicine's controlled vocabulary thesaurus. It consists of sets of terms naming descriptors in a hierarchical structure that permits searching at various levels of specificity. This thesaurus is used by NLM for indexing articles from biomedical journals, cataloguing of books, documents, etc.
http://hl7.org/fhir/specimen-status:
  name: SpecimenStatus
  vocabulary_prefix: specimen-status
  vocabulary_uri: http://hl7.org/fhir/specimen-status
  fhir_system: http://hl7.org/fhir/specimen-status
  description: Codes providing the status/availability of a specimen.
urn:oid:2.16.840.1.113883.6.238:
  name: CDC Rec
  vocabulary_prefix: CDCREC
  vocabulary_uri: https://cdc.gov#  # Google's AI search recommended this over the one below
  # vocabulary_uri: https://phinvads.cdc.gov/vads/ViewCodeSystem.action?id=2.16.840.1.113883.6.238#
  fhir_system: urn:oid:2.16.840.1.113883.6.238
  description: The U.S. Centers for Disease Control and Prevention (CDC) has prepared a code set for use in coding race and ethnicity data. This code set is based on current federal standards for classifying data on race and ethnicity, specifically the minimum race and ethnicity categories defined by the U.S. Office of Management and Budget (OMB) and a more detailed set of race and ethnicity categories maintained by the U.S. Bureau of the Census (BC).
http://terminology.hl7.org/CodeSystem/v3-NullFlavor:
  name: NullFlavor
  vocabulary_prefix: v3-nullflavor
  vocabulary_uri: http://terminology.hl7.org/CodeSystem/v3-NullFlavor#
  fhir_system: http://terminology.hl7.org/CodeSystem/v3-NullFlavor
  description: A collection of codes specifying why a valid value is not present.
http://terminology.hl7.org/CodeSystem/v3-RoleCode:
  name: RoleCode
  vocabulary_prefix: v3-rolecode
  vocabulary_uri: http://terminology.hl7.org/CodeSystem/v3-RoleCode#
  fhir_system: http://terminology.hl7.org/CodeSystem/v3-RoleCode
  description: A set of codes further specifying the kind of Role; specific classification codes for further qualifying RoleClass codes.
http://terminology.hl7.org/CodeSystem/v2-0131:
  name: contactRole2
  vocabulary_prefix: v3-nullflavor
  vocabulary_uri: http://terminology.hl7.org/CodeSystem/v2-0131#
  fhir_system: http://terminology.hl7.org/CodeSystem/v2-0131
  description: Code system of concepts which specify a relationship role that the next of kin/associated parties plays with regard to the patient. Also used in referrals, for example, it may be necessary to identify the contact representative at the clinic that sent a referral. Used in HL7 Version 2 messaging in the NK1 and CTD segments after 2.5, when it replace 2.16.840.1.113883.18.57.
http://hl7.org/fhir/administrative-gender:
  name: AdministrativeGender
  vocabulary_prefix: administrative-gender
  vocabulary_uri: http://hl7.org/fhir/administrative-gender#
  fhir_system: http://hl7.org/fhir/administrative-gender
  description: The gender of a person used for administrative purposes.
http://terminology.hl7.org/CodeSystem/condition-ver-status:
  name: ConditionVerificationStatus
  vocabulary_prefix: condition-ver-status
  vocabulary_uri: http://terminology.hl7.org/CodeSystem/condition-ver-status#
  fhir_system: http://terminology.hl7.org/CodeSystem/condition-ver-status
  description: The verification status to support or decline the clinical status of the condition or diagnosis.
https://purl.obolibrary.org/obo/symp.owl:
  name: Symptom Ontology
  vocabulary_prefix: SYMP
  vocabulary_uri: http://purl.obolibrary.org/obo/SYMP_
  fhir_system: https://purl.obolibrary.org/obo/symp.owl
  description: The Symptom Ontology has been developed as a standardized ontology for symptoms of human diseases.
http://purl.obolibrary.org/obo/CAMO:
  name: Common Access Model Ontology
  vocabulary_prefix: CAMO
  vocabulary_uri: http://purl.obolibrary.org/obo/CAMO_
  fhir_system: http://purl.obolibrary.org/obo/camo.owl
  description: Organized terms in support of a shared data model.
http://purl.obolibrary.org/obo/duo.owl:
  name: Data Use Ontology
  vocabulary_prefix: DUO
  vocabulary_uri: http://purl.obolibrary.org/obo/DUO_
  fhir_system: http://purl.obolibrary.org/obo/duo.owl
  description: DUO is an ontology which represent data use conditions.
http://purl.org/ga4gh/kin.owl:
  name: KIN - The Family History Relations Ontology
  description: KIN is a family relations ontology developed as part of the Global Alliance for Genomics and Health Pedigree Standard project. It allows using an OWL reasoner to automatically validate a family history graph and infer new relations.
  vocabulary_prefix: KIN
  vocabulary_uri: http://purl.obolibrary.org/obo/KIN_
  fhir_system: http://purl.org/ga4gh/kin.owl
