[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "linkml-data-generator"
dynamic = ["version"]
description = "Common Access Model factory for fake data. "
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Eric Torstenson", email = "eric.s.torstenson@vumc.org" }
]
dependencies = [
    "factory-boy>=3.3.0",
    "linkml>=1.6.0",
    "linkml-runtime>=1.6.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "common-access-model",
    "the-caddie",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
common-access-model = { url = "https://github.com/include-dcc/common-access-model/releases/download/v0.2.0/common_access_model-0.2.0-py3-none-any.whl" }
the-caddie = { git = "https://github.com/carrollaboratory/the-caddie" }
